# All panels use the native lowlighter/metrics GitHub Action.
# Main SVG: profile, compact achievements, calendar, languages, topics, habits,
# activity, projects, notable contributions, follow-up, star lists, and stars.
name: Metrics
'on':
  schedule:
  - cron: 17 3,15 * * *
  workflow_dispatch: {}
  push:
    branches:
    - main
    - master
    paths:
    - README.md
    - .github/workflows/main.yml
permissions:
  contents: write
concurrency:
  group: profile-metrics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  github-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out the upstream compatibility fixes
      uses: actions/checkout@v4
      with:
        repository: lowlighter/metrics
        ref: 1e49d0b8b932624dd7762147e35ccc137eda09f1
        path: metrics-upstream
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /package.json
          /source/plugins/achievements/list/users.mjs
          /source/plugins/achievements/queries/achievements.graphql
          /source/plugins/activity/index.mjs
          /source/plugins/habits/index.mjs
    - name: Prepare the official runtime with the upstream fixes
      working-directory: metrics-upstream
      run: |
        cat > "$RUNNER_TEMP/metrics.Dockerfile" <<'DOCKERFILE'
        FROM ghcr.io/lowlighter/metrics:v3.34
        COPY source/plugins/achievements/list/users.mjs /metrics/source/plugins/achievements/list/users.mjs
        COPY source/plugins/achievements/queries/achievements.graphql /metrics/source/plugins/achievements/queries/achievements.graphql
        COPY source/plugins/activity/index.mjs /metrics/source/plugins/activity/index.mjs
        COPY source/plugins/habits/index.mjs /metrics/source/plugins/habits/index.mjs
        DOCKERFILE
        METRICS_RUNTIME_VERSION=$(node -p 'require("./package.json").version')
        docker build --file "$RUNNER_TEMP/metrics.Dockerfile" --tag "metrics:$METRICS_RUNTIME_VERSION" .
    - name: Generate the combined Metrics SVG
      timeout-minutes: 15
      # Upstream PR #1834 fixes Projects classic and missing PushEvent commits.
      uses: lowlighter/metrics@1e49d0b8b932624dd7762147e35ccc137eda09f1
      with:
        token: ${{ secrets.METRICS }}
        committer_token: ${{ github.token }}
        # Use the prepared image with the pinned upstream fixes.
        use_prebuilt_image: 'no'
        user: LulietLyan
        filename: github-metrics.svg
        template: classic
        base: header, activity, community, repositories, metadata
        config_timezone: Asia/Shanghai
        config_display: large
        config_animations: 'yes'
        # Official styling hook: use the full canvas and keep the calendar compact.
        extras_css: |
          svg.large .starlist {
            box-sizing: border-box;
            width: 100%;
            padding-right: 28px;
          }
          .starlist .repositories {
            display: flex;
            flex-wrap: wrap;
          }
          .starlist .repository {
            min-width: 0;
          }
          .starlist .repository .name,
          .starlist .repository .description {
            width: calc(100% - 38px);
          }
          .starlist .repository .name span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
          /* The upstream scraper reads list prefixes as counts (0, 1, 2). */
          .starlist > .count,
          .starlist .language.details small > div:first-child {
            display: none;
          }
          /* Target the native isometric calendar, keeping its full-year viewBox. */
          section > svg[version="1.1"] {
            display: block;
            width: 72%;
            height: auto;
            margin: -60px auto 0 !important;
          }
        debug: 'yes'
        retries: '2'
        retries_delay: '15'
        config_order: base.header, achievements, base.activity+community, base.repositories, isocalendar, languages,
          topics, habits, activity, repositories, notable, followup, starlists, stars
        plugins_errors_fatal: 'yes'
        plugin_lines: 'yes'
        plugin_lines_sections: base
        plugin_isocalendar: 'yes'
        plugin_isocalendar_duration: full-year
        plugin_languages: 'yes'
        # The history analyzer crashes on the notes repository; use GitHub data.
        plugin_languages_indepth: 'no'
        plugin_languages_sections: most-used
        plugin_languages_details: bytes-size, percentage
        plugin_languages_categories: markup, programming
        plugin_languages_colors: github
        plugin_languages_limit: '8'
        plugin_languages_skipped: LulietLyan/LulietLyan
        plugin_achievements: 'yes'
        plugin_achievements_display: compact
        plugin_achievements_threshold: C
        plugin_achievements_limit: '12'
        plugin_topics: 'yes'
        plugin_topics_mode: icons
        plugin_topics_limit: '15'
        plugin_topics_sort: stars
        plugin_starlists: 'yes'
        plugin_starlists_limit: '3'
        plugin_starlists_languages: 'yes'
        plugin_starlists_limit_languages: '8'
        plugin_starlists_limit_repositories: '2'
        plugin_starlists_shuffle_repositories: 'no'
        plugin_stars: 'yes'
        plugin_stars_limit: '4'
        plugin_habits: 'yes'
        plugin_habits_from: '300'
        plugin_habits_days: '30'
        plugin_habits_facts: 'yes'
        plugin_habits_charts: 'yes'
        plugin_habits_charts_type: graph
        plugin_habits_trim: 'no'
        plugin_habits_languages_limit: '6'
        plugin_activity: 'yes'
        plugin_activity_limit: '6'
        plugin_activity_load: '100'
        plugin_activity_days: '30'
        plugin_activity_visibility: public
        plugin_activity_timestamps: 'yes'
        plugin_activity_filter: push, issue, pr, release, review, fork
        plugin_repositories: 'yes'
        plugin_repositories_pinned: '6'
        plugin_notable: 'yes'
        plugin_notable_from: all
        plugin_notable_types: commit, pull_request
        plugin_notable_repositories: 'yes'
        plugin_notable_self: 'no'
        plugin_followup: 'yes'
        plugin_followup_sections: repositories, user
