# All panels use the native lowlighter/metrics GitHub Action.
# Main SVG: profile, compact achievements, calendar, languages, topics, habits,
# activity, projects, notable contributions, follow-up, star lists, and stars.
# Achievements has one display setting per render, so its detailed style
# is the only Metrics panel kept as a separate SVG.
name: Metrics
'on':
  schedule:
  - cron: 17 3,15 * * *
  workflow_dispatch: {}
  push:
    branches:
    - main
    - master
    paths:
    - README.md
    - .github/workflows/main.yml
permissions:
  contents: write
concurrency:
  group: profile-metrics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Generate the combined Metrics SVG
      uses: lowlighter/metrics@latest
      with:
        token: ${{ secrets.METRICS }}
        committer_token: ${{ github.token }}
        user: LulietLyan
        filename: github-metrics.svg
        template: classic
        base: header, activity, community, repositories, metadata
        config_timezone: Asia/Shanghai
        config_display: large
        config_animations: 'yes'
        config_order: base.header, achievements, base.activity+community, base.repositories, isocalendar, languages,
          topics, habits, activity, repositories, notable, followup, starlists, stars
        plugins_errors_fatal: 'no'
        plugin_lines: 'yes'
        plugin_lines_sections: base
        plugin_isocalendar: 'yes'
        plugin_isocalendar_duration: full-year
        plugin_languages: 'yes'
        plugin_languages_indepth: 'yes'
        plugin_languages_sections: most-used, recently-used
        plugin_languages_details: bytes-size, percentage
        plugin_languages_categories: markup, programming
        plugin_languages_recent_categories: markup, programming
        plugin_languages_colors: github
        plugin_languages_limit: '8'
        plugin_languages_recent_days: '14'
        plugin_languages_recent_load: '100'
        plugin_languages_analysis_timeout: '45'
        plugin_languages_analysis_timeout_repositories: '10'
        plugin_languages_skipped: LulietLyan/LulietLyan
        plugin_achievements: 'yes'
        plugin_achievements_display: compact
        plugin_achievements_threshold: C
        plugin_achievements_limit: '12'
        plugin_topics: 'yes'
        plugin_topics_mode: icons
        plugin_topics_limit: '15'
        plugin_topics_sort: stars
        plugin_starlists: 'yes'
        plugin_starlists_only: Guidance, Star my repositories
        plugin_starlists_limit: '2'
        plugin_starlists_languages: 'yes'
        plugin_starlists_limit_languages: '8'
        plugin_starlists_limit_repositories: '2'
        plugin_starlists_shuffle_repositories: 'no'
        plugin_stars: 'yes'
        plugin_stars_limit: '4'
        plugin_habits: 'yes'
        plugin_habits_from: '300'
        plugin_habits_days: '30'
        plugin_habits_facts: 'yes'
        plugin_habits_charts: 'yes'
        plugin_habits_charts_type: graph
        plugin_habits_trim: 'no'
        plugin_habits_languages_limit: '6'
        plugin_activity: 'yes'
        plugin_activity_limit: '6'
        plugin_activity_load: '100'
        plugin_activity_days: '30'
        plugin_activity_visibility: public
        plugin_activity_timestamps: 'yes'
        plugin_activity_filter: push, issue, pr, release, review, fork
        plugin_repositories: 'yes'
        plugin_repositories_pinned: '6'
        plugin_notable: 'yes'
        plugin_notable_from: all
        plugin_notable_types: commit, pull_request
        plugin_notable_repositories: 'yes'
        plugin_notable_self: 'no'
        plugin_followup: 'yes'
        plugin_followup_sections: repositories, user
    - name: Generate the alternate detailed achievement display
      if: ${{ !cancelled() }}
      uses: lowlighter/metrics@latest
      with:
        token: ${{ secrets.METRICS }}
        committer_token: ${{ github.token }}
        user: LulietLyan
        filename: metrics.achievements.detailed.svg
        template: classic
        base: ''
        config_timezone: Asia/Shanghai
        config_display: large
        config_animations: 'yes'
        plugins_errors_fatal: 'yes'
        plugin_achievements: 'yes'
        plugin_achievements_display: detailed
        plugin_achievements_threshold: C
        plugin_achievements_limit: '8'
